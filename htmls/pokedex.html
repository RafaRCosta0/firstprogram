<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="../css/pokedex.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="pokedex-container">

        <header class="pokedex-header">
            <div class="top-bar">

                <div>
                <button class="filter-toggle" id="filterToggle" aria-label="Abrir filtros">⭐</button>
                <h2 class="text-favoritos">Favoritos</h2>
                </div>

                <div class="bolinhas">
                    <span class="b1"></span>
                    <span class="b2"></span>
                    <span class="b3"></span>
                </div>
                
                <div class="search-container">
                    <input type="text" id="searchPokemon" placeholder="Search Pokémon...">
                    <button class="search-filter-btn" id="searchFilterBtn">
                        <img src="../assets/filtro.png" class="icon-filter">
                    </button> 
        <audio id="musicaFundo" src="../assets/musicteste.mp3" loop></audio>

            <button id="btnSom">
                🔇
            </button>
            </div>

            <div class="filter-panel hidden" id="filterPanel">
                <div class="filter-group">
                    <label for="typeFilter">Filtrar por tipo</label>
                    <select id="typeFilter">
                        <option value="">Todos</option>
                        <option value="grass">Grass</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="bug">Bug</option>
                        <option value="normal">Normal</option>
                        <option value="poison">Poison</option>
                        <option value="electric">Electric</option>
                        <option value="ground">Ground</option>
                        <option value="fairy">Fairy</option>
                        <option value="fighting">Fighting</option>
                        <option value="psychic">Psychic</option>
                        <option value="rock">Rock</option>
                        <option value="ghost">Ghost</option>
                        <option value="ice">Ice</option>
                        <option value="dragon">Dragon</option>
                        <option value="flying">Flying</option>
                    </select>
                </div>

                

                <div class="filter-actions">
                    <button id="clearFilters">Limpar filtros</button>
                </div>
            </div>
            

        </header>

        <section class="pokemon-grid" id="pokemonGrid"></section>

        <div class="load-more-container">

                <button id="loadMoreBtn">
                Carregar Mais
                </button>
        </div>

    </main>

   <footer class="Rodapé">
        <p>Todos os direitos reservados &copy; 2026 Pokédex</p>

        <div class="redes">
            <a href="https://www.instagram.com/vinijr?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==">
            <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/profile.php?id=100065151476470">
            <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="https://www.tiktok.com/pt-BR/">
            <i class="fa-brands fa-tiktok"></i>
            </a>

            <a href="https://discord.gg/jDaSNQZtC2">
            <i class="fa-brands fa-discord"></i>
            </a>

        </div>
   </footer>

    <script src="../scripts/pokedex.js"></script>
</body>
</html>
